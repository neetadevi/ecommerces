<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login & Register | Unique Fashion</title>
  <link rel="icon" type="image/png" href="https://www.lakshita.com/cdn/shop/files/Favicon_2.png?crop=center&height=32&v=1783600880&width=32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4b0006;
      --primary-hover: #7e000a;
      --gold: #ab8c52;
      --gold-light: #e8d4ae;
      --bg: #faf9f6;
      --card-bg: #ffffff;
      --text: #212121;
      --text-light: #66635e;
      --border: #e1dfd8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      background: #4b0006;
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .top-bar span {
      color: var(--gold-light);
      font-weight: 600;
    }

    .navbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar-brand img {
      height: 38px;
      display: block;
    }

    .navbar-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .navbar-link:hover {
      color: var(--primary-hover);
    }

    .auth-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .auth-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .auth-header {
      background: var(--primary);
      color: #fff;
      padding: 28px 24px;
      text-align: center;
    }

    .auth-header h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .auth-header p {
      font-size: 13px;
      color: var(--gold-light);
    }

    .auth-tabs {
      display: flex;
      background: #f4f0e8;
      border-bottom: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 15px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: #ffffff;
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
    }

    .auth-body {
      padding: 32px 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }

    .alert-error {
      background: #fde8e8;
      color: #9b1c1c;
      border: 1px solid #f8b4b4;
      display: block;
    }

    .alert-success {
      background: #def7ec;
      color: #03543f;
      border: 1px solid #bcf0da;
      display: block;
    }

    .logged-in-box {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .logged-in-box .user-avatar {
      width: 64px;
      height: 64px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 2px solid var(--gold);
    }

    .logged-in-box h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .logged-in-box p {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 24px;
    }

    .logged-in-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-secondary {
      padding: 12px 24px;
      border: 1px solid var(--primary);
      background: #ffffff;
      color: var(--primary);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: #f9f9f9;
    }

    .footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-light);
      border-top: 1px solid var(--border);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    India's Biggest Ethnic Wear Brand &bull; <span>FREE SHIPPING & SAME-DAY DISPATCH</span>
  </div>

  <header class="navbar">
    <a href="index.html" class="navbar-brand">
      <img src="https://www.lakshita.com/cdn/shop/files/LOGO_1_9ac4258c-f72a-404a-8d2b-982cca7ce38b.png?width=320" alt="Unique Fashion Logo" />
    </a>
    <a href="index.html" class="navbar-link">
      &larr; Return to Store
    </a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 id="headerTitle">Customer Login</h1>
        <p id="headerSub">Access your orders, wishlist, and recommendations</p>
      </div>

      <div class="auth-tabs" id="tabsBar">
        <button class="auth-tab active" id="tabSignIn" onclick="setMode('login')">Sign In</button>
        <button class="auth-tab" id="tabRegister" onclick="setMode('signup')">Create Account</button>
      </div>

      <div class="auth-body">
        <div id="authAlert" class="alert"></div>

        <!-- Form for Login / Signup -->
        <form id="authForm" onsubmit="handleAuth(event)">
          <div class="form-group" id="fullNameGroup" style="display:none;">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="name@example.com" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="Enter password (minimum 6 characters)" />
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </form>

        <!-- Logged in state view -->
        <div id="loggedInBox" class="logged-in-box">
          <div class="user-avatar" id="avatarInitial">U</div>
          <h3>Welcome Back!</h3>
          <p id="userEmailDisplay"></p>
          <div class="logged-in-actions">
            <a href="index.html" class="submit-btn" style="text-decoration:none; display:inline-block; width:auto; padding:12px 24px;">Start Shopping</a>
            <button class="btn-secondary" onclick="logout()">Log Out</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    &copy; 2026 Unique Fashion. All Rights Reserved. Secure Authentication powered by Supabase.
  </footer>

  <script>
    const SUPABASE_URL = "https://osdwapwpjovhrrnbtfmk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZHdhcHdwam92aHJybmJ0Zm1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNzQ1NTcsImV4cCI6MjEwOTY1MDU1N30.PjEsnUll7VyBGt2mGIHab8p96csjpYiyHOBtFWvY99o";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMode = 'login';

    function setMode(mode) {
      currentMode = mode;
      const tabSignIn = document.getElementById('tabSignIn');
      const tabRegister = document.getElementById('tabRegister');
      const fullNameGroup = document.getElementById('fullNameGroup');
      const headerTitle = document.getElementById('headerTitle');
      const headerSub = document.getElementById('headerSub');
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('authAlert');

      alertBox.className = 'alert';
      alertBox.style.display = 'none';

      if (mode === 'login') {
        tabSignIn.classList.add('active');
        tabRegister.classList.remove('active');
        fullNameGroup.style.display = 'none';
        headerTitle.textContent = 'Customer Login';
        headerSub.textContent = 'Access your orders, wishlist, and recommendations';
        submitBtn.textContent = 'Sign In';
      } else {
        tabRegister.classList.add('active');
        tabSignIn.classList.remove('active');
        fullNameGroup.style.display = 'block';
        headerTitle.textContent = 'Create Account';
        headerSub.textContent = 'Join Unique Fashion for exclusive offers and easy checkout';
        submitBtn.textContent = 'Create Account';
      }
    }

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      const authForm = document.getElementById('authForm');
      const tabsBar = document.getElementById('tabsBar');
      const loggedInBox = document.getElementById('loggedInBox');

      if (session && session.user) {
        authForm.style.display = 'none';
        tabsBar.style.display = 'none';
        loggedInBox.style.display = 'block';
        document.getElementById('headerTitle').textContent = 'My Account';
        document.getElementById('headerSub').textContent = 'Manage your profile and orders';
        document.getElementById('userEmailDisplay').textContent = session.user.email;
        document.getElementById('avatarInitial').textContent = (session.user.email[0] || 'U').toUpperCase();
      } else {
        authForm.style.display = 'block';
        tabsBar.style.display = 'flex';
        loggedInBox.style.display = 'none';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('authAlert');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.className = 'alert';
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';

      try {
        if (currentMode === 'login') {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'Login successful! Redirecting...';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        } else {
          const fullName = document.getElementById('fullName').value.trim();
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName } }
          });
          if (error) throw error;
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'Account created successfully! Check your email to verify, or sign in now.';
          setTimeout(() => {
            setMode('login');
          }, 2000);
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = err.message || 'Authentication error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentMode === 'login' ? 'Sign In' : 'Create Account';
      }
    }

    async function logout() {
      await supabase.auth.signOut();
      checkAuth();
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
